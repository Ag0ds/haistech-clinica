server:
  port: 8080

spring:
  application:
    name: clinica
  datasource:
    url: jdbc:postgresql://localhost:5432/haistech
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
